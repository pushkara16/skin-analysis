<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Analysis - Loading</title>
    <style>
        /* Fullscreen background video */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Centered content */
        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            color: white;
        }

        /* Loading spinner styles */
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

    </style>
    <script>
        // Poll every 2 seconds to check if the YOLO processing is done
        function checkStatus() {
            fetch('/check_analysis_status')
                .then(response => response.json())
                .then(data => {
                    if (data.done) {
                        // If processing is done, redirect to the results page
                        window.location.href = '/show_analysis_result';
                    } else {
                        // Poll again after 2 seconds
                        setTimeout(checkStatus, 2000);
                    }
                })
                .catch(error => {
                    console.error('Error checking analysis status:', error);
                });
        }

        window.onload = function () {
            // Start checking the status as soon as the page loads
            checkStatus();
        };
    </script>
</head>
<body>
    <!-- Background Video -->
    <video autoplay muted loop class="bg-video" playsinline>
        <source src="{{ url_for('static', filename='images/4bfd478459729565b0c9df0aff5d4484.mp4') }}" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    

    <!-- Foreground Content -->
    <div class="content">
        <h2>Please wait while we analyze your video...</h2>
    </div>
</body>
</html>
