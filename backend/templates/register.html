<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - SkinCare Analyser</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.6)), 
                        url("{{ url_for('static', filename='images/Rose water for your face_ Benefits and how to use _ Curology.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            color: black;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            width: 320px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: black;
            font-size: 2.5rem;
            font-weight: 600;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #f5f5f5;
            color: black;
            font-size: 1rem;
        }

        input::placeholder {
            color: #888;
        }

        input[type="submit"] {
            background-color: #c71585;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
        }

        input[type="submit"]:hover {
            background-color: #a10e6a;
        }

        @media (max-width: 768px) {
            .form-container {
                width: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Register</h2>
        <form method="post">
            Name: <input type="text" name="name" required><br>
            Age: <input type="number" name="age" min="18" required title="You must be at least 18 years old"><br>
            Gender:
            <select name="gender" required>
                <option value="">Select</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Non-binary">Non-binary</option>
                <option value="Prefer not to say">Prefer not to say</option>
            </select><br>
            Username: <input type="text" name="username" required><br>
            Email: <input type="email" name="email" required><br>
            Password: <input type="password" name="password" required minlength="8" title="Password must be at least 8 characters long"><br>
            <input type="submit" value="Register">
        </form>
    </div>
</body>
</html>
