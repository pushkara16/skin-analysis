<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <!-- Minimal profile views -->
  <rect x="10" y="35" width="20" height="30" rx="2" stroke="#FF96B9" stroke-width="1" fill="none"/>
  <rect x="40" y="35" width="20" height="30" rx="2" stroke="#FF96B9" stroke-width="1" fill="none"/>
  <rect x="70" y="35" width="20" height="30" rx="2" stroke="#FF96B9" stroke-width="1" fill="none"/>
  
  <!-- Left profile face -->
  <path d="M15 50L25 50" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  <circle cx="17" cy="45" r="1" fill="#FF96B9"/>
  <path d="M18 55C19 56 20 56.5 22 56.5" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Front profile face -->
  <path d="M45 50L55 50" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  <circle cx="47" cy="45" r="1" fill="#FF96B9"/>
  <circle cx="53" cy="45" r="1" fill="#FF96B9"/>
  <path d="M47 55C48 56 49 56.5 50 56.5C51 56.5 52 56 53 55" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Right profile face -->
  <path d="M75 50L85 50" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  <circle cx="83" cy="45" r="1" fill="#FF96B9"/>
  <path d="M78 56.5C80 56.5 81 56 82 55" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Direction indicators - minimal arrows -->
  <path d="M20 25L20 30" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  <path d="M50 25L50 30" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  <path d="M80 25L80 30" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Connecting paths -->
  <path d="M20 70L50 70L80 70" stroke="#FF96B9" stroke-width="1" stroke-dasharray="2 2"/>
  <path d="M20 70L20 65" stroke="#FF96B9" stroke-width="1"/>
  <path d="M50 70L50 65" stroke="#FF96B9" stroke-width="1"/>
  <path d="M80 70L80 65" stroke="#FF96B9" stroke-width="1"/>
  
  <!-- Camera rotation indication -->
  <path d="M35 80C45 85 55 85 65 80" stroke="#FF96B9" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M65 80L62 77" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  <path d="M65 80L62 83" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Step 3 indicator -->
  <circle cx="50" cy="12" r="10" fill="none" stroke="#FF96B9" stroke-width="1"/>
  <text x="50" y="16" font-family="Arial" font-size="12" fill="#FF96B9" text-anchor="middle">3</text>
</svg>
