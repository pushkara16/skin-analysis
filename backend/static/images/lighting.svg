  <path d="M64 36L71 29" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Camera lens representation -->
  <circle cx="50" cy="50" r="25" stroke="#FF96B9" stroke-width="1" fill="none"/>
  <circle cx="50" cy="50" r="35" stroke="#FF96B9" stroke-width="0.5" fill="none" stroke-dasharray="2 2"/>
  
  <!-- Step 2 indicator -->
