<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" fill="none">
  <!-- Minimal light source -->
  <circle cx="50" cy="50" r="15" stroke="#FF96B9" stroke-width="1.5" fill="none"/>
  <circle cx="50" cy="50" r="5" fill="#FF96B9" fill-opacity="0.3"/>
  
  <!-- Minimal light rays -->
  <path d="M50 20L50 30" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  <path d="M50 70L50 80" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  <path d="M20 50L30 50" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  <path d="M70 50L80 50" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  
  <path d="M29 29L36 36" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
  <path d="M64 64L71 71" stroke="#FF96B9" stroke-width="1" stroke-linecap="round"/>
